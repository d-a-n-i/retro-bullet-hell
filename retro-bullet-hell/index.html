<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>retro-bullet-hell</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
        color: #9ca3af;
      }
      #boot-error {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        font-family: system-ui, sans-serif;
        color: #fecaca;
        background: rgba(10, 10, 15, 0.95);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="Game canvas"></canvas>
      <div id="hud" aria-hidden="true">
        <div id="stats">
          <div id="level">Lv 1</div>
          <div id="health">HP 100</div>
          <div id="score">Score 0</div>
        </div>
        <div id="fps">-- FPS</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
